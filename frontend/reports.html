<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reports • Stock Management</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/reports.css" />
    <link rel="stylesheet" href="/css/theme.css" />
    <script src="/js/theme.js"></script>
</head>

<body class="reports-body">
    <div class="reports-shell">
        <header class="reports-header">
            <div class="reports-header-left">
                <div class="reports-mark">SM</div>
                <div>
                    <h1 class="reports-brand">Stock Manager</h1>
                    <p class="reports-subtitle">Reports</p>
                </div>
            </div>

            <div class="reports-header-right">
                <div class="reports-user">
                    <span class="user-label">Signed in as</span>
                    <strong id="reports-user-name">…</strong>
                    <span class="user-role-badge" id="reports-user-role">…</span>
                </div>
                <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme" title="Toggle dark mode">
                    <span class="icon-moon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                    </span>
                    <span class="icon-sun">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                    </span>
                </button>
                <a href="/dashboard" class="btn btn-secondary">Dashboard</a>
            </div>
        </header>

        <nav class="reports-tabs" aria-label="Report tabs">
            <button class="reports-tab active" data-report="inventory">Inventory</button>
            <button class="reports-tab" data-report="low-stock">Low Stock</button>
            <button class="reports-tab" data-report="out-of-stock">Out of Stock</button>
            <button class="reports-tab" data-report="transactions">Transactions</button>
            <button class="reports-tab" data-report="audit-logs">Audit Log</button>
        </nav>

        <main class="reports-panel">
            <div class="reports-panel-header">
                <div>
                    <h2 id="report-title">Current Inventory</h2>
                    <p class="reports-meta" id="report-meta">Loading…</p>
                </div>
                <div class="reports-actions">
                    <button class="btn btn-excel" id="report-excel">Export Excel</button>
                    <button class="btn btn-pdf" id="report-pdf">Export PDF</button>
                    <button class="btn btn-print" id="report-print">Print</button>
                </div>
            </div>

            <div class="reports-table-wrapper">
                <table class="reports-table" id="report-table">
                    <thead id="report-head"></thead>
                    <tbody id="report-body">
                        <tr>
                            <td class="empty">Loading…</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

    <script src="/js/api.js"></script>
    <script src="/js/reports.js"></script>
</body>

</html>
