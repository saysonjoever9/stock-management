<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customers • Stock Management</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👥</text></svg>">
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/sidebar.css" />
    <link rel="stylesheet" href="/css/customers.css" />
    <link rel="stylesheet" href="/css/theme.css" />
    <script src="/js/theme.js"></script>
</head>

<body>
    <div class="app-shell">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="main-area">
            <header class="topbar" id="topbar"></header>
            <main class="content">
                <div class="page-header">
                    <div class="page-header-left">
                        <h1 class="page-title">Customers</h1>
                        <p class="page-subtitle">Manage your customer database</p>
                    </div>
                    <button id="add-customer-btn" class="btn btn-primary">+ Add Customer</button>
                </div>

                <section class="panel">
                    <div class="filters">
                        <input id="customer-search" type="search" placeholder="Search customers…" />
                    </div>

                    <div class="table-wrapper">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Phone</th>
                                    <th>Address</th>
                                    <th>Total Purchases</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="customers-body">
                                <tr>
                                    <td colspan="6" class="empty">Loading…</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <div class="modal-backdrop" id="customer-modal" hidden>
        <div class="modal" role="dialog" aria-modal="true">
            <div class="modal-header">
                <h2 id="customer-modal-title">Add Customer</h2>
                <button type="button" class="modal-close" id="customer-modal-close">×</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="customer-id" />
                <div class="form-grid">
                    <div class="form-group full">
                        <label>Full Name *</label>
                        <input id="c-name" maxlength="120" />
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input id="c-email" type="email" maxlength="120" />
                    </div>
                    <div class="form-group">
                        <label>Phone</label>
                        <input id="c-phone" maxlength="30" />
                    </div>
                    <div class="form-group full">
                        <label>Address</label>
                        <textarea id="c-address"></textarea>
                    </div>
                    <div class="form-group full">
                        <label>Notes</label>
                        <textarea id="c-notes"></textarea>
                    </div>
                </div>
                <div id="customer-form-error" class="alert alert-error" hidden></div>
                <div class="modal-actions">
                    <button type="button" class="btn" id="customer-cancel">Cancel</button>
                    <button type="button" class="btn btn-primary" id="customer-save">Save</button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="/js/api.js"></script>
    <script src="/js/auth-sidebar.js"></script>
    <script src="/js/customers.js"></script>
</body>

</html>
