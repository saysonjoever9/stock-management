<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pending Users • Stock Management</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/sidebar.css" />
    <link rel="stylesheet" href="/css/theme.css" />
    <script src="/js/theme.js"></script>
</head>

<body>
    <div class="app-shell">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="main-area">
            <header class="topbar" id="topbar"></header>
            <main class="content">
                <div class="page-header">
                    <div class="page-header-left">
                        <h1 class="page-title">Pending Registrations</h1>
                        <p class="page-subtitle">Approve or reject new user accounts</p>
                    </div>
                    <button id="refresh-btn" class="btn">Refresh</button>
                </div>

                <section class="panel">
                    <div class="table-wrapper">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Username</th>
                                    <th>Full Name</th>
                                    <th>Email</th>
                                    <th>Role</th>
                                    <th>Registered</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="pending-body">
                                <tr>
                                    <td colspan="6" class="empty">Loading…</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="/js/api.js"></script>
    <script src="/js/auth-sidebar.js"></script>
    <script src="/js/pending.js"></script>
</body>

</html>
