<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products • Stock Management</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/sidebar.css" />
    <link rel="stylesheet" href="/css/theme.css" />
    <script src="/js/theme.js"></script>
</head>

<body>
    <div class="app-shell">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="main-area">
            <header class="topbar" id="topbar"></header>
            <main class="content">
                <div class="page-header">
                    <div class="page-header-left">
                        <h1 class="page-title">Products</h1>
                        <p class="page-subtitle">Manage your inventory items</p>
                    </div>
                    <button id="add-product-btn" class="btn btn-primary">+ Add Product</button>
                </div>

                <section class="panel">
                    <div class="filters">
                        <input id="search-input" type="search" placeholder="Search by name or SKU…" />
                        <select id="filter-category"></select>
                        <select id="filter-supplier"></select>
                        <select id="filter-status">
                            <option value="">All statuses</option>
                            <option value="in">In stock</option>
                            <option value="low">Low stock</option>
                            <option value="out">Out of stock</option>
                            <option value="inactive">Inactive</option>
                        </select>
                    </div>

                    <div class="table-wrapper">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>SKU</th>
                                    <th>Name</th>
                                    <th>Category</th>
                                    <th>Supplier</th>
                                    <th>Stock</th>
                                    <th>Min</th>
                                    <th>Cost</th>
                                    <th>Sell</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="products-body">
                                <tr>
                                    <td colspan="10" class="empty">Loading…</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="pagination" id="pagination"></div>
                </section>
            </main>
        </div>
    </div>

    <div class="modal-backdrop" id="product-modal" hidden>
        <div class="modal" role="dialog" aria-modal="true">
            <div class="modal-header">
                <h2 id="product-modal-title">Add Product</h2>
                <button type="button" class="modal-close" id="product-modal-close">×</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="product-id" />
                <div class="form-grid">
                    <div class="form-group"><label>SKU *</label><input id="p-sku" maxlength="60" /></div>
                    <div class="form-group"><label>Barcode</label><input id="p-barcode" maxlength="60" /></div>
                    <div class="form-group full"><label>Name *</label><input id="p-name" maxlength="150" /></div>
                    <div class="form-group full"><label>Description</label><textarea id="p-description"></textarea></div>
                    <div class="form-group"><label>Category</label><select id="p-category"></select></div>
                    <div class="form-group"><label>Supplier</label><select id="p-supplier"></select></div>
                    <div class="form-group"><label>Unit</label><input id="p-unit" value="pcs" /></div>
                    <div class="form-group"><label>Cost Price</label><input id="p-cost" type="number" step="0.01" min="0" value="0" /></div>
                    <div class="form-group"><label>Selling Price</label><input id="p-sell" type="number" step="0.01" min="0" value="0" /></div>
                    <div class="form-group"><label>Initial Stock</label><input id="p-stock" type="number" min="0" value="0" /></div>
                    <div class="form-group"><label>Min Stock Level</label><input id="p-min" type="number" min="0" value="0" /></div>
                    <div class="form-group"><label>Max Stock Level</label><input id="p-max" type="number" min="0" value="0" /></div>
                    <div class="form-group"><label>Status</label>
                        <select id="p-status"><option value="active">Active</option><option value="inactive">Inactive</option></select>
                    </div>
                </div>
                <div id="product-form-error" class="alert alert-error" hidden></div>
                <div class="modal-actions">
                    <button type="button" class="btn" id="product-cancel">Cancel</button>
                    <button type="button" class="btn btn-primary" id="product-save">Save</button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="/js/api.js"></script>
    <script src="/js/auth-sidebar.js"></script>
    <script src="/js/products.js"></script>
</body>

</html>
