<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pricing • Stock Management</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/sidebar.css" />
    <link rel="stylesheet" href="/css/pricing.css" />
    <link rel="stylesheet" href="/css/theme.css" />
    <script src="/js/theme.js"></script>
</head>

<body>
    <div class="app-shell">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="main-area">
            <header class="topbar" id="topbar"></header>
            <main class="content">
                <div class="page-header">
                    <div class="page-header-left">
                        <h1 class="page-title">Pricing</h1>
                        <p class="page-subtitle">Manage product prices and profit margins</p>
                    </div>
                </div>

                <section class="panel">
                    <div class="filters">
                        <input id="pricing-search" type="search" placeholder="Search products…" />
                        <select id="filter-pricing-category">
                            <option value="">All categories</option>
                        </select>
                        <select id="filter-pricing-margin">
                            <option value="">All margins</option>
                            <option value="low">Low margin (&lt; 20%)</option>
                            <option value="high">High margin (≥ 40%)</option>
                        </select>
                    </div>

                    <div class="table-wrapper">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>SKU</th>
                                    <th>Product</th>
                                    <th>Category</th>
                                    <th>Cost</th>
                                    <th>Selling</th>
                                    <th>Profit</th>
                                    <th>Margin</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="pricing-body">
                                <tr>
                                    <td colspan="8" class="empty">Loading…</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="pagination" id="pricing-pagination"></div>
                </section>
            </main>
        </div>
    </div>

    <div class="modal-backdrop" id="pricing-modal" hidden>
        <div class="modal" role="dialog" aria-modal="true">
            <div class="modal-header">
                <h2 id="pricing-modal-title">Edit Price</h2>
                <button type="button" class="modal-close" id="pricing-modal-close">×</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="pricing-id" />
                <div class="form-grid">
                    <div class="form-group">
                        <label>Product</label>
                        <input id="pricing-name" disabled />
                    </div>
                    <div class="form-group">
                        <label>SKU</label>
                        <input id="pricing-sku" disabled />
                    </div>
                    <div class="form-group">
                        <label>Cost Price (₱)</label>
                        <input id="pricing-cost" type="number" step="0.01" min="0" />
                    </div>
                    <div class="form-group">
                        <label>Selling Price (₱)</label>
                        <input id="pricing-sell" type="number" step="0.01" min="0" />
                    </div>
                </div>

                <div id="pricing-margin-preview" class="margin-preview"></div>

                <div id="pricing-form-error" class="alert alert-error" hidden></div>
                <div class="modal-actions">
                    <button type="button" class="btn" id="pricing-cancel">Cancel</button>
                    <button type="button" class="btn btn-primary" id="pricing-save">Save Price</button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="/js/api.js"></script>
    <script src="/js/auth-sidebar.js"></script>
    <script src="/js/pricing.js"></script>
</body>

</html>
