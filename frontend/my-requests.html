<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Requests • Stock Management</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/sidebar.css" />
    <link rel="stylesheet" href="/css/theme.css" />
    <script src="/js/theme.js"></script>
</head>

<body>
    <div class="app-shell">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="main-area">
            <header class="topbar" id="topbar"></header>
            <main class="content">
                <div class="page-header">
                    <div class="page-header-left">
                        <h1 class="page-title">My Requests</h1>
                        <p class="page-subtitle">Your purchase order requests</p>
                    </div>
                    <button id="new-request-btn" class="btn btn-primary">+ New Request</button>
                </div>

                <section class="panel">
                    <div class="table-wrapper">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Request #</th>
                                    <th>Product</th>
                                    <th>Qty</th>
                                    <th>Status</th>
                                    <th>Requested</th>
                                    <th>Notes</th>
                                </tr>
                            </thead>
                            <tbody id="requests-body">
                                <tr>
                                    <td colspan="6" class="empty">Loading…</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <div class="modal-backdrop" id="request-modal" hidden>
        <div class="modal" role="dialog" aria-modal="true">
            <div class="modal-header">
                <h2>New Stock Request</h2>
                <button type="button" class="modal-close" id="request-modal-close">×</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Product *</label>
                    <select id="request-product">
                        <option value="">Select product…</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Quantity Requested *</label>
                    <input id="request-qty" type="number" min="1" value="1" />
                </div>
                <div class="form-group">
                    <label>Reason / Notes</label>
                    <textarea id="request-notes" placeholder="Why do you need this stock?"></textarea>
                </div>
                <div id="request-error" class="alert alert-error" hidden></div>
                <div class="modal-actions">
                    <button type="button" class="btn" id="request-cancel">Cancel</button>
                    <button type="button" class="btn btn-primary" id="request-save">Submit Request</button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="/js/api.js"></script>
    <script src="/js/auth-sidebar.js"></script>
    <script src="/js/my-requests.js"></script>
</body>

</html>
