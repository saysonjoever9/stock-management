<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analytics • Stock Management</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/sidebar.css" />
    <link rel="stylesheet" href="/css/dashboard.css" />
    <link rel="stylesheet" href="/css/theme.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="/js/theme.js"></script>
    <style>
        /* ---------- Summary stat cards ----------
           6 ka cards → 3 per row aron walay card nga mo-inusara sa sunod nga row */
        #summary-grid {
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        /* ---------- Analytics grid ----------
           2 ka column: ang .wide cards mo-occupy sa tibuok row.
           (Dati: auto-fit 280px → 4 columns → naay 2 columns nga bakante) */
        .analytics-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
            margin-bottom: 24px;
            align-items: stretch;
        }
        
        .analytics-card {
            display: flex;
            flex-direction: column;
            min-width: 0;
            overflow: hidden;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 20px 24px;
            box-shadow: var(--shadow-sm);
        }
        
        .analytics-card h3 {
            margin: 0 0 16px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-2);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .chart-wrap {
            position: relative;
            width: 100%;
            min-width: 0;
            height: 260px;
        }

        /* Guard: ang canvas dili mo-pa-wider sa iyang card (cause sa horizontal scroll) */
        .chart-wrap canvas {
            max-width: 100%;
        }
        
        .top-list {
            display: flex;
            flex-direction: column;
            flex: 1;
            gap: 10px;
            min-width: 0;
        }

        /* Loading / empty message — center sa card */
        .top-list > p {
            margin: auto 0;
            text-align: center;
        }
        
        .top-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: var(--panel-soft);
            border-radius: var(--radius-sm);
            gap: 12px;
        }
        
        .top-item-name {
            font-weight: 500;
            color: var(--text);
            font-size: 13.5px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .top-item-meta {
            font-size: 12px;
            color: var(--muted);
            flex-shrink: 0;
        }
        
        .low-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            min-width: 0;
            padding: 10px 14px;
            background: var(--warning-soft);
            border-radius: var(--radius-sm);
            color: var(--warning);
            font-size: 13px;
            font-weight: 500;
        }

        /* Ang product name mo-take sa remaining space; ang quantity dili mo-shrink */
        .low-item > span:first-child {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .low-item > span:last-child {
            flex-shrink: 0;
            font-variant-numeric: tabular-nums;
        }

        /* Ang Low Stock Alerts full-width man → i-tile ang mga alert imbes mag-stretch */
        #low-stock-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 10px;
        }

        #low-stock-list > p {
            grid-column: 1 / -1;
            margin: 0;
            text-align: center;
        }
        
        .low-item.out {
            background: var(--danger-soft);
            color: var(--danger);
        }
        
        .analytics-card.wide {
            grid-column: 1 / -1;
        }

        /* ---------- Responsive ---------- */
        @media (max-width: 1100px) {
            #summary-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 900px) {
            .analytics-grid {
                grid-template-columns: minmax(0, 1fr);
            }
        }

        @media (max-width: 620px) {
            #summary-grid {
                grid-template-columns: minmax(0, 1fr);
            }
            .analytics-card {
                padding: 18px;
            }
            .chart-wrap {
                height: 220px;
            }
        }
    </style>
</head>

<body>
    <div class="app-shell">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="main-area">
            <header class="topbar" id="topbar"></header>
            <main class="content">
                <div class="page-header">
                    <div class="page-header-left">
                        <h1 class="page-title">Analytics</h1>
                        <p class="page-subtitle">Business insights and trends</p>
                    </div>
                    <button id="refresh-btn" class="btn">↻ Refresh</button>
                </div>

                <section id="summary-grid" class="stats-grid"></section>

                <div class="analytics-grid">
                    <div class="analytics-card wide">
                        <h3>📈 Sales Trend (Last 30 days)</h3>
                        <div class="chart-wrap">
                            <canvas id="sales-chart"></canvas>
                        </div>
                    </div>

                    <div class="analytics-card">
                        <h3>🏆 Top Selling Products</h3>
                        <div class="top-list" id="top-products-list">
                            <p style="color:var(--muted);font-size:13px;">Loading…</p>
                        </div>
                    </div>

                    <div class="analytics-card">
                        <h3>📂 Stock by Category</h3>
                        <div class="chart-wrap">
                            <canvas id="category-chart"></canvas>
                        </div>
                    </div>

                    <div class="analytics-card wide">
                        <h3>⚠️ Low Stock Alerts</h3>
                        <div class="top-list" id="low-stock-list">
                            <p style="color:var(--muted);font-size:13px;">Loading…</p>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="/js/api.js"></script>
    <script src="/js/auth-sidebar.js"></script>
    <script src="/js/analytics.js"></script>
</body>

</html>
