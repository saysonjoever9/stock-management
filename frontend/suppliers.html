<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Suppliers • Stock Management</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/sidebar.css" />
    <link rel="stylesheet" href="/css/theme.css" />
    <script src="/js/theme.js"></script>
</head>

<body>
    <div class="app-shell">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="main-area">
            <header class="topbar" id="topbar"></header>
            <main class="content">
                <div class="page-header">
                    <div class="page-header-left">
                        <h1 class="page-title">Suppliers</h1>
                        <p class="page-subtitle">Manage your vendor contacts</p>
                    </div>
                    <button id="add-supplier-btn" class="btn btn-primary">+ Add Supplier</button>
                </div>

                <section class="panel">
                    <div class="table-wrapper">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Contact</th>
                                    <th>Email</th>
                                    <th>Phone</th>
                                    <th>Products</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="suppliers-body">
                                <tr>
                                    <td colspan="6" class="empty">Loading…</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <div class="modal-backdrop" id="supplier-modal" hidden>
        <div class="modal" role="dialog" aria-modal="true">
            <div class="modal-header">
                <h2 id="supplier-modal-title">Add Supplier</h2>
                <button type="button" class="modal-close" id="supplier-modal-close">×</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="supplier-id" />
                <div class="form-grid">
                    <div class="form-group full">
                        <label for="s-name">Name *</label>
                        <input id="s-name" maxlength="150" />
                    </div>
                    <div class="form-group">
                        <label for="s-contact">Contact Person</label>
                        <input id="s-contact" maxlength="120" />
                    </div>
                    <div class="form-group">
                        <label for="s-email">Email</label>
                        <input id="s-email" type="email" maxlength="120" />
                    </div>
                    <div class="form-group">
                        <label for="s-phone">Phone</label>
                        <input id="s-phone" maxlength="30" />
                    </div>
                    <div class="form-group full">
                        <label for="s-address">Address</label>
                        <textarea id="s-address"></textarea>
                    </div>
                    <div class="form-group full">
                        <label for="s-notes">Notes</label>
                        <textarea id="s-notes"></textarea>
                    </div>
                </div>
                <div id="supplier-form-error" class="alert alert-error" hidden></div>
                <div class="modal-actions">
                    <button type="button" class="btn" id="supplier-cancel">Cancel</button>
                    <button type="button" class="btn btn-primary" id="supplier-save">Save</button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="/js/api.js"></script>
    <script src="/js/auth-sidebar.js"></script>
    <script src="/js/suppliers.js"></script>
</body>

</html>
