<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register • Stock Management</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/login.css" />
    <link rel="stylesheet" href="/css/theme.css" />
    <script src="/js/theme.js"></script>
</head>

<body class="login-body">
    <button class="theme-toggle login-theme-toggle" id="theme-toggle" aria-label="Toggle theme" title="Toggle dark mode">
        <span class="icon-moon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </span>
        <span class="icon-sun">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </span>
    </button>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-brand-badge">CREATE ACCOUNT</div>
            <h1 class="login-title">Register</h1>
            <p class="login-subtitle">Choose your role to continue</p>

            <form id="register-form" novalidate>
                <div class="form-group">
                    <label for="full_name">Full Name</label>
                    <input id="full_name" type="text" maxlength="120" required />
                </div>

                <div class="form-group">
                    <label for="username">Username</label>
                    <input id="username" type="text" maxlength="50" required />
                    <small>Letters, numbers, underscore only (3–50 chars)</small>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input id="email" type="email" maxlength="120" required />
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input id="password" type="password" minlength="8" required />
                    <small>At least 8 characters with upper, lower, and digit</small>
                </div>

                <div class="form-group">
                    <label for="role">Role</label>
                    <select id="role" name="role" required>
                        <option value="admin" id="admin-option">Admin (First only)</option>
                        <option value="staff" selected>Staff</option>
                    </select>
                    <small id="admin-hint" style="display:none;color:#dc2626;">
                        An admin already exists. Only staff registration is allowed.
                    </small>
                </div>

                <div id="register-error" class="" hidden></div>
                <div id="register-ok" class="" hidden></div>

                <button id="register-btn" class="btn btn-primary btn-full" type="submit">
                    <span class="btn-label">Create Account</span>
                </button>
            </form>

            <p class="login-hint">
                Already have an account? <a href="/">Sign in</a>
            </p>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/register.js"></script>
</body>

</html>
