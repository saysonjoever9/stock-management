<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Users • Stock Management</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/sidebar.css" />
    <link rel="stylesheet" href="/css/theme.css" />
    <script src="/js/theme.js"></script>
</head>

<body>
    <div class="app-shell">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="main-area">
            <header class="topbar" id="topbar"></header>
            <main class="content">
                <div class="page-header">
                    <div class="page-header-left">
                        <h1 class="page-title">Users</h1>
                        <p class="page-subtitle">Manage system accounts and permissions</p>
                    </div>
                    <button id="add-user-btn" class="btn btn-primary">+ Add User</button>
                </div>

                <section class="panel">
                    <div class="table-wrapper">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Username</th>
                                    <th>Full Name</th>
                                    <th>Email</th>
                                    <th>Role</th>
                                    <th>Active</th>
                                    <th>Last Login</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="users-body">
                                <tr>
                                    <td colspan="7" class="empty">Loading…</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <div class="modal-backdrop" id="user-modal" hidden>
        <div class="modal" role="dialog" aria-modal="true">
            <div class="modal-header">
                <h2 id="user-modal-title">Add User</h2>
                <button type="button" class="modal-close" id="user-modal-close">×</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="user-id" />
                <div class="form-grid">
                    <div class="form-group">
                        <label for="u-username">Username *</label>
                        <input id="u-username" maxlength="50" />
                    </div>
                    <div class="form-group">
                        <label for="u-fullname">Full Name *</label>
                        <input id="u-fullname" maxlength="120" />
                    </div>
                    <div class="form-group">
                        <label for="u-email">Email</label>
                        <input id="u-email" type="email" maxlength="120" />
                    </div>
                    <div class="form-group">
                        <label for="u-role">Role *</label>
                        <select id="u-role">
                            <option value="staff">Staff</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>
                    <div class="form-group full" id="password-group">
                        <label for="u-password">Password *</label>
                        <input id="u-password" type="password" />
                    </div>
                    <div class="form-group" id="active-group" hidden>
                        <label for="u-active">Active</label>
                        <select id="u-active">
                            <option value="true">Yes</option>
                            <option value="false">No</option>
                        </select>
                    </div>
                </div>
                <div id="user-form-error" class="alert alert-error" hidden></div>
                <div class="modal-actions">
                    <button type="button" class="btn" id="user-cancel">Cancel</button>
                    <button type="button" class="btn btn-primary" id="user-save">Save</button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="/js/api.js"></script>
    <script src="/js/auth-sidebar.js"></script>
    <script src="/js/users.js"></script>
</body>

</html>
